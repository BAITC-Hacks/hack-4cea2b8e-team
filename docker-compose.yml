services:
  app:
    build: .
    ports:
      - "127.0.0.1:${GRAPH_PORT:-8000}:8000"
    environment:
      # Ключ подхватится из .env, если он есть; иначе — демо-режим.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL: ${MODEL:-gpt-4o-mini}
      DEMO_MODE: ${DEMO_MODE:-0}
    volumes:
      - ./data:/app/data
